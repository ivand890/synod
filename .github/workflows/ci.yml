name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the published package shape
        run: pnpm test:package

  codex_compatibility:
    name: Codex ${{ matrix.codex-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - codex-version: "0.148.0-alpha.1"
            expected-status: supported
            expected-healthy: "true"
          - codex-version: "0.148.0-alpha.9"
            expected-status: known-good
            expected-healthy: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the matrix Codex CLI
        env:
          CODEX_VERSION: ${{ matrix.codex-version }}
        run: npm install --global "@openai/codex@$CODEX_VERSION"
      - name: Verify the live Codex capability contract
        env:
          SYNOD_EXPECTED_CODEX_VERSION: ${{ matrix.codex-version }}
          SYNOD_EXPECTED_CODEX_STATUS: ${{ matrix.expected-status }}
          SYNOD_EXPECTED_DOCTOR_HEALTHY: ${{ matrix.expected-healthy }}
        run: pnpm test:codex-compatibility

  release-closeout:
    name: Release closeout
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Read closeout phase
        id: closeout_phase
        run: |
          closeout_status="$(node --input-type=module -e "import closeout from './RELEASE-CLOSEOUT.json' with { type: 'json' }; process.stdout.write(typeof closeout.publicVerification?.status === 'string' ? closeout.publicVerification.status : '')")"
          case "$closeout_status" in
            pending|verified) printf 'status=%s\n' "$closeout_status" >> "$GITHUB_OUTPUT" ;;
            *) echo "Release closeout has an unsupported publication phase: $closeout_status" >&2; exit 1 ;;
          esac
      - name: Validate pending closeout locally
        if: steps.closeout_phase.outputs.status == 'pending'
        run: |
          package_name="$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.name)")"
          package_version="$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.version)")"
          pnpm exec tsx scripts/validate-release-closeout.ts \
            --phase pre-tag \
            --package "$package_name" \
            --version "$package_version" \
            --tag "v$package_version" \
            --json
      - name: Verify published closeout against public evidence
        if: steps.closeout_phase.outputs.status == 'verified'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          package_name="$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.name)")"
          package_version="$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.version)")"
          release_tag="$(node --input-type=module -e "import closeout from './RELEASE-CLOSEOUT.json' with { type: 'json' }; process.stdout.write(closeout.tag)")"
          tagged_commit="$(git rev-parse "$release_tag^{commit}")"
          pnpm exec tsx scripts/verify-public-release-closeout.ts \
            --file RELEASE-CLOSEOUT.json \
            --package "$package_name" \
            --version "$package_version" \
            --tag "$release_tag" \
            --tag-sha "$tagged_commit" \
            --repository "$GITHUB_REPOSITORY" \
            --json

  required:
    name: Required
    if: always()
    needs:
      - test
      - package-smoke
      - codex_compatibility
      - release-closeout
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          CODEX_RESULT: ${{ needs.codex_compatibility.result }}
          CLOSEOUT_RESULT: ${{ needs.release-closeout.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$CODEX_RESULT" = "success"
          test "$CLOSEOUT_RESULT" = "success"
